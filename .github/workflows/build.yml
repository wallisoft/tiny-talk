# Rebuild dist/ whenever the sources change, so the app and the site always read the latest.
name: build
on:
  push:
    branches: [main]
    paths: [core/**, edge/**, words/**, recipes.txt, tools/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - name: Commit dist/ if it changed
        run: |
          git config user.name "tiny-talk build"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || (git commit -m "dist: rebuilt" && git push)
